name: Update playlist and ntdtv EPG

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时一次(UTC), 避开整点, 减少排队延迟
  workflow_dispatch:         # 允许在 Actions 页面手动触发

permissions:
  contents: write            # 把生成的文件提交回仓库需要
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ntdtv     # 脚本放在仓库里的 ntdtv 文件夹
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ntdtv/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate playlist and EPG
        run: |
          mkdir -p site work
          URL="https://www.ntdtv.com/b5/live-tv"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          EPG_URL="https://${OWNER}.github.io/${REPO}/ntdtv.xml"
          python live_iptv.py "$URL" --out work/ntdtv.m3u --epg-url "$EPG_URL"
          python epg.py "$URL" --channels-json work/ntdtv.json --out site/ntdtv.xml --gzip
          cp work/ntdtv.m3u site/ntdtv.m3u

      - name: Sanity check
        run: |
          python - <<'PY'
          import gzip
          import xml.etree.ElementTree as ET
          m3u = open("site/ntdtv.m3u", encoding="utf-8").read()
          urls = [l for l in m3u.splitlines() if l.startswith("http")]
          print(f"m3u channels={len(urls)}")
          assert len(urls) >= 3, "频道数量异常, 不发布"
          assert all(u.startswith("https://") and ".m3u8" in u for u in urls), "存在不完整的播放地址, 不发布"
          root = ET.parse("site/ntdtv.xml").getroot()
          ch = len(root.findall("channel"))
          pr = len(root.findall("programme"))
          print(f"epg channels={ch} programmes={pr}")
          assert ch >= 1 and pr >= 100, "节目数量异常, 不发布"
          with gzip.open("site/ntdtv.xml.gz", "rb") as f:
              gz_root = ET.fromstring(f.read())
          assert len(gz_root.findall("programme")) == pr, "gz 与 xml 内容不一致, 不发布"
          print("gz OK")
          PY

      - name: Commit generated files to repo
        continue-on-error: true      # 提交失败(如分支受保护)不影响 Pages 发布
        run: |
          mkdir -p output
          cp site/ntdtv.m3u site/ntdtv.xml site/ntdtv.xml.gz output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "没有变化, 不提交"
          else
            git commit -m "Update playlist and EPG ($(date -u +'%F %H:%M') UTC)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ntdtv/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
