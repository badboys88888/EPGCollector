name: Merge 合并EPG

on:
  schedule:
    - cron: "0 20 * * *"    # 每天一次,UTC 20:00 = 北京时间凌晨 4:00
  workflow_dispatch:         # 允许手动运行

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge EPG
        run: python EPGMerge/merge_epg.py --prune-empty --keep-days 1

      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add EPGMerge/output
          git diff --staged --quiet || git commit -m "update merged EPG"
          git push
